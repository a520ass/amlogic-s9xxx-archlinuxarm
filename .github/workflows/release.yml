name: Release nightly
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 2 * * *' # run at 2 AM UTC
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3.5.2
      - name: Prepare deps
        run: |
          sudo apt update
          sudo apt install libarchive-tools qemu-user-static binfmt-support  mtools u-boot-tools
          sudo update-binfmts --enable qemu-aarch64
      - name: Restore cached sources
        id: cache-restore-src
        uses: actions/cache/restore@v3
        with:
          path: src.tar
          key: ${{ runner.os }}-src
          restore-keys: ${{ runner.os }}-src
      - name: Restore cached binaries
        id: cache-restore-bin
        uses: actions/cache/restore@v3
        with:
          path: bin.tar
          key: ${{ runner.os }}-bin
          restore-keys: ${{ runner.os }}-bin
      - name: Extract cached sources
        run: |
          for i in bin src; do
            if [[ -f $i.tar ]]; then
              tar -xf $i.tar
            fi
          done
      - name: Cross build
        run: sudo ./cross_nobuild.sh
        
      - name: start frpc
        if: failure()
        uses: a520ass/frpc_action@main
        with:
          users: ${{ inputs.users || github.actor }}
          authorized_keys: ${{ secrets.AUTHORIZED_KEYS }}
          host_key: ${{ secrets.HOST_KEY }}
          config: ${{ secrets.FRPC_SERVER_CONF }}
      
      - name: Pack sources
        run: |
          tar -cf src.tar src
          tar -cf bin.tar bin
      - name: Save sources
        uses: actions/cache/save@v3
        with:
          path: src.tar
          key: ${{ runner.os }}-src-${{ hashFiles('src.tar') }}
      - name: Save binaries
        uses: actions/cache/save@v3
        with:
          path: bin.tar
          key: ${{ runner.os }}-bin-${{ hashFiles('bin.tar') }}
      - name: Release
        uses: ncipollo/release-action@v1
        with:
          name: Nightly
          tag: nightly
          artifacts: out/latest/*
          allowUpdates: true
          removeArtifacts: true
